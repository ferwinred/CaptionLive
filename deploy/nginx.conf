# Load balancer for N CaptionLive replicas. No sticky sessions needed:
# every replica can serve any audience member and accept any stage (state is in Redis).
upstream captionlive {
    server app:8000;          # docker compose DNS resolves every replica
    keepalive 64;
}

server {
    listen 80;
    client_max_body_size 1m;

    # Audio ingest (WebSocket)
    location /ws/ {
        proxy_pass http://captionlive;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Caption streams (Server-Sent Events): never buffer
    location ~ ^/api/sessions/[^/]+/stream$ {
        proxy_pass http://captionlive;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Static web apps: cache at the edge
    location /static/ {
        proxy_pass http://captionlive;
        expires 10m;
    }

    location / {
        proxy_pass http://captionlive;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

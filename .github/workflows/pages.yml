name: Deploy web to GitHub Pages
on:
  push:
    branches: [main, claude/captionlive-project-setup-9rqvlk]
    paths: ["captionlive/web/**", "scripts/build_static.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      api:
        description: "Backend URL (empty = demo mode)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_static.py --out site --api "${{ inputs.api || vars.CAPTIONLIVE_API_URL }}"
      # Publishes to the gh-pages branch (Settings → Pages → Deploy from branch → gh-pages)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "captionlive"
version = "0.1.0"
description = "Open source, real-time multilingual captions for conferences at scale."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "CaptionLive contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-genai>=2.20",
  "redis>=5.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "segno>=1.6",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
captionlive = "captionlive.cli:main"

[tool.setuptools.packages.find]
include = ["captionlive*"]

[tool.setuptools.package-data]
captionlive = ["py.typed", "web/*.html", "web/*.svg", "web/js/*", "web/css/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
